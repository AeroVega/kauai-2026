name: Validate dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate source and itinerary
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          python -m json.tool itinerary.json > /dev/null
      - name: Test Today in several device timezones
        run: |
          for zone in UTC America/Denver Pacific/Honolulu Europe/London; do
            TZ="$zone" node --test tests/*.test.mjs
          done
