name: Deploy Kauaʻi PWA to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Validate application files
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          python -m json.tool itinerary.json > /dev/null
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Stamp build and cache version
        run: |
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" js/app.js service-worker.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5.0.0