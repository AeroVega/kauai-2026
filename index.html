<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kauaʻi">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>Kauai 2026 Dashboard</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <a class="brand" href="./" aria-label="Kauai 2026 Dashboard">
    <span class="brand-mark">🌺</span><span>Kauai 2026 Dashboard</span>
  </a>
  <nav class="nav" aria-label="Primary navigation">
    <button class="nav-item active" data-view="today"><span class="nav-icon">⌂</span><span>Today</span></button>
    <button class="nav-item" data-view="plan"><span class="nav-icon">☷</span><span>Plan</span></button>
    <button class="nav-item" data-view="map"><span class="nav-icon">⌖</span><span>Map</span></button>
    <button class="nav-item" data-view="more"><span class="nav-icon">•••</span><span>More</span></button>
  </nav>
  <span class="build-spacer" aria-hidden="true"></span>
</header>
<div class="layout">
  <main id="app" aria-live="polite"><div class="empty">Loading Kauaʻi 2026…</div></main>
</div>
</div>
<script>
if("serviceWorker"in navigator){navigator.serviceWorker.register("./service-worker.js").then(r=>r.update()).catch(()=>{})}
function showStartupError(error,source){const a=document.getElementById("app");if(!a)return;const message=error?.message||String(error||"Unknown error"),stack=error?.stack||"No stack trace was provided by the browser.",file=source?.filename||"",line=source?.lineno?source.lineno+":"+source.colno:"";a.innerHTML='<div class="empty startup-error"><strong>The dashboard could not start.</strong><p>Technical details are below.</p><details open><summary>Error details</summary><pre id="startupDiagnostics"></pre></details><button class="action" id="reloadStartup">Reload</button></div>';const pre=document.getElementById("startupDiagnostics");if(pre)pre.textContent="Message: "+message+"\n"+(file?"Source: "+file+(line?" ("+line+")":"")+"\n":"")+"\nStack:\n"+stack+"\n\nURL: "+location.href+"\nTime: "+new Date().toISOString();document.getElementById("reloadStartup")?.addEventListener("click",()=>location.reload())}
window.addEventListener("error",e=>showStartupError(e.error||e.message,e),true);
window.addEventListener("unhandledrejection",e=>showStartupError(e.reason));
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
