<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" id="viewportMeta">
<script>
(function(){
  const m=document.getElementById("viewportMeta");
  if(!m)return;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const narrowTouchPortrait=()=>navigator.maxTouchPoints>0&&screen.width<screen.height&&screen.width/screen.height<=3/5;
  const syncPhoneLayout=()=>{
    const isPhonePortrait=narrowTouchPortrait();
    document.documentElement.classList.toggle("narrow-touch-portrait",isPhonePortrait);
    if(isPhonePortrait){
      const height=window.visualViewport?.height||window.innerHeight;
      document.documentElement.style.setProperty("--app-viewport-height",height+"px");
    }
  };
  syncPhoneLayout();
  window.addEventListener("orientationchange",()=>requestAnimationFrame(syncPhoneLayout));
  window.visualViewport?.addEventListener("resize",syncPhoneLayout);
  if(ios&&window.innerWidth>screen.width*1.5){
    m.content="width=device-width,initial-scale=1";
    requestAnimationFrame(()=>{m.content="width=device-width,initial-scale=1,viewport-fit=cover"});
  }
})();
</script>
<meta name="theme-color" content="#f5f4ef" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kauaʻi">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="kauai-icon-1024.png">
<link rel="stylesheet" href="styles.css">
<title>Kauai 2026 Dashboard</title>
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <a class="brand" href="./" aria-label="Kauai 2026 Dashboard">
    <img class="brand-mark" src="kauai-icon-1024.png" alt="" aria-hidden="true"><span>Kauai 2026 Dashboard</span>
  </a>
  <nav class="nav nav-desktop" aria-label="Primary navigation">
    <button class="nav-item active" data-view="today"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7M6 8.5V21h12V8.5M9.5 21v-7h5v7"/></svg></span><span>Today</span></button>
    <button class="nav-item" data-view="plan"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h12M8 12h12M8 19h12M3.5 5l1 1 1.5-2M3.5 12l1 1 1.5-2M3.5 19l1 1 1.5-2"/></svg></span><span>Plan</span></button>
    <button class="nav-item" data-view="map"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6.5 5-2.5 8 2.5L21 4v13.5L16 20l-8-2.5-5 2.5V6.5ZM8 4v13.5M16 6.5V20M12.2 10.2a2 2 0 1 1 4 0c0 1.5-2 3.2-2 3.2s-2-1.7-2-3.2Z"/></svg></span><span>Map</span></button>
    <button class="nav-item" data-view="more"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><span>More</span></button>
  </nav>
  <span class="build-spacer" aria-hidden="true"></span>
</header>
<div class="layout">
  <main id="app" aria-live="polite"><div class="empty">Loading Kauaʻi 2026…</div></main>
</div>
<nav class="nav nav-mobile" aria-label="Primary navigation">
  <button class="nav-item active" data-view="today"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7M6 8.5V21h12V8.5M9.5 21v-7h5v7"/></svg></span><span>Today</span></button>
  <button class="nav-item" data-view="plan"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h12M8 12h12M8 19h12M3.5 5l1 1 1.5-2M3.5 12l1 1 1.5-2M3.5 19l1 1 1.5-2"/></svg></span><span>Plan</span></button>
  <button class="nav-item" data-view="map"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6.5 5-2.5 8 2.5L21 4v13.5L16 20l-8-2.5-5 2.5V6.5ZM8 4v13.5M16 6.5V20M12.2 10.2a2 2 0 1 1 4 0c0 1.5-2 3.2-2 3.2s-2-1.7-2-3.2Z"/></svg></span><span>Map</span></button>
  <button class="nav-item" data-view="more"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><span>More</span></button>
</nav>
</div>
<script>
(function(){const dark=localStorage.getItem("kauai-theme")==="dark";const m=document.getElementById("themeColor");if(dark){document.documentElement.dataset.theme="dark";if(m)m.content="#101311"}})();
if("serviceWorker"in navigator){navigator.serviceWorker.register("./service-worker.js").then(r=>r.update()).catch(()=>{})}
function showStartupError(error,source){const a=document.getElementById("app");if(!a)return;const message=error?.message||String(error||"Unknown error"),stack=error?.stack||"No stack trace was provided by the browser.",file=source?.filename||"",line=source?.lineno?source.lineno+":"+source.colno:"";a.innerHTML='<div class="empty startup-error"><strong>The dashboard could not start.</strong><p>Technical details are below.</p><details open><summary>Error details</summary><pre id="startupDiagnostics"></pre></details><button class="action" id="reloadStartup">Reload</button></div>';const pre=document.getElementById("startupDiagnostics");if(pre)pre.textContent="Message: "+message+"\n"+(file?"Source: "+file+(line?" ("+line+")":"")+"\n":"")+"\nStack:\n"+stack+"\n\nURL: "+location.href+"\nTime: "+new Date().toISOString();document.getElementById("reloadStartup")?.addEventListener("click",()=>location.reload())}
window.addEventListener("error",e=>showStartupError(e.error||e.message,e),true);
window.addEventListener("unhandledrejection",e=>showStartupError(e.reason));
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
